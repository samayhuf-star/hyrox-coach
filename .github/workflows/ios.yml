name: iOS build and TestFlight

# Compiles the app on every pull request and push (no signing, no secrets needed).
# On main (or a manual run) it also signs the app and uploads it to TestFlight.
# Uploading to TestFlight is NOT a submission to App Review.
#
# Repository secrets needed for the TestFlight job:
#   ASC_KEY_ID      App Store Connect API key ID
#   ASC_ISSUER_ID   App Store Connect issuer ID
#   ASC_KEY_P8      full contents of the AuthKey_XXXX.p8 file
#   APPLE_TEAM_ID   10-character Apple Developer team ID

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

env:
  SCHEME: HyroxAllInOneCoach
  PROJECT: HyroxAllInOneCoach.xcodeproj
  BUILD_OFFSET: "10"

jobs:
  compile:
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Generate Xcode project
        working-directory: ios
        run: |
          brew install xcodegen
          xcodegen generate
      - name: Compile (simulator, unsigned)
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild build \
            -project "$PROJECT" -scheme "$SCHEME" -configuration Release \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO > "$RUNNER_TEMP/build.log" 2>&1 || {
              tail -n 80 "$RUNNER_TEMP/build.log"
              # Surface compiler errors as annotations so they show on the pull request.
              grep -E "error:" "$RUNNER_TEMP/build.log" | sort -u | head -n 40 | while IFS= read -r line; do
                file=$(printf '%s' "$line" | sed -nE "s#^$GITHUB_WORKSPACE/([^:]+):([0-9]+):[0-9]+: error: .*#\\1#p")
                num=$(printf '%s' "$line" | sed -nE "s#^[^:]+:([0-9]+):[0-9]+: error: .*#\\1#p")
                msg=$(printf '%s' "$line" | sed -E "s#^.*error: ##")
                if [ -n "$file" ]; then echo "::error file=$file,line=$num::$msg"; else echo "::error::$line"; fi
              done
              exit 1
            }
          tail -n 20 "$RUNNER_TEMP/build.log"

  testflight:
    needs: compile
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: macos-26
    timeout-minutes: 60
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - name: Check secrets
        run: |
          for name in ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8 APPLE_TEAM_ID; do
            if [ -z "${!name}" ]; then echo "::error::Repository secret $name is not set"; exit 1; fi
          done
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Generate Xcode project
        working-directory: ios
        run: |
          brew install xcodegen
          xcodegen generate
      - name: Write App Store Connect key
        run: |
          mkdir -p "$RUNNER_TEMP/keys"
          printf '%s\n' "$ASC_KEY_P8" > "$RUNNER_TEMP/keys/AuthKey_${ASC_KEY_ID}.p8"
      - name: Archive
        working-directory: ios
        run: |
          set -o pipefail
          BUILD_NUMBER=$((GITHUB_RUN_NUMBER + BUILD_OFFSET))
          echo "Build number: $BUILD_NUMBER"
          xcodebuild archive \
            -project "$PROJECT" -scheme "$SCHEME" -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/app.xcarchive" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" CODE_SIGN_STYLE=Automatic \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey_${ASC_KEY_ID}.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" | tail -n 200
      - name: Upload to TestFlight
        working-directory: ios
        run: |
          set -o pipefail
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>${APPLE_TEAM_ID}</string>
            <key>signingStyle</key><string>automatic</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
            <key>uploadSymbols</key><true/>
          </dict>
          </plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/app.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey_${ASC_KEY_ID}.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" | tail -n 100
      - name: Remove key
        if: always()
        run: rm -rf "$RUNNER_TEMP/keys"
