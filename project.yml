name: HyroxAllInOneCoach
options:
  bundleIdPrefix: com.superapp
  developmentLanguage: en

settings:
  base:
    PRODUCT_NAME: HyroxAllInOneCoach
    SWIFT_VERSION: 6.0
    MARKETING_VERSION: 1.0
    CURRENT_PROJECT_VERSION: 1
    SUPPORTED_PLATFORMS: iphoneos iphonesimulator
    TARGETED_DEVICE_FAMILY: '1'
    SUPPORTS_MACCATALYST: NO
    ALWAYS_SEARCH_USER_PATHS: NO
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  configs:
    Release:
      SWIFT_OPTIMIZATION_LEVEL: '-O'
      SWIFT_COMPILATION_MODE: wholemodule
      ENABLE_NS_ASSERTIONS: NO

packages:
  RevenueCat:
    url: https://github.com/RevenueCat/purchases-ios.git
    from: 5.43.0

targets:
  HyroxAllInOneCoach:
    type: application
    platform: iOS
    deploymentTarget: '17.0'
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.superapp.hyroxallinonecoachyzr40
    dependencies:
      - package: RevenueCat
        product: RevenueCat
    sources:
      - path: HyroxAllInOneCoach
    info:
      path: HyroxAllInOneCoach/Info.plist
      properties:
        CFBundleDevelopmentRegion: $(DEVELOPMENT_LANGUAGE)
        CFBundleDisplayName: Hybrid Trainer
        CFBundleExecutable: $(EXECUTABLE_NAME)
        CFBundleIdentifier: $(PRODUCT_BUNDLE_IDENTIFIER)
        CFBundleInfoDictionaryVersion: 6.0
        CFBundleName: $(PRODUCT_NAME)
        CFBundlePackageType: $(PRODUCT_BUNDLE_PACKAGE_TYPE)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleIconName: AppIcon
        CFBundleURLTypes:
          - CFBundleURLName: Coach sign-in
            CFBundleURLSchemes: [hybridcoach]
        ITSAppUsesNonExemptEncryption: false
        UIAppFonts: [BarlowCondensed-Bold.ttf, BarlowCondensed-SemiBold.ttf]
        UIUserInterfaceStyle: Dark
        LSRequiresIPhoneOS: true
        UIApplicationSupportsIndirectInputEvents: true
        UILaunchStoryboardName: LaunchScreen
        UIRequiredDeviceCapabilities: [arm64]
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight

schemes:
  HyroxAllInOneCoach:
    build:
      targets:
        HyroxAllInOneCoach: all
    run:
      config: Debug
    archive:
      config: Release
